<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a1a">
  <meta name="format-detection" content="telephone=no">
  <!-- Bilder und Streams ohne Herkunftsangabe laden – so wie richtige TV-Apps. Viele Logo-Server sperren sonst fremde Apps. -->
  <meta name="referrer" content="no-referrer">
  <title>Telvo Player</title>
  <link rel="icon" href="img/icon.png">
  <link rel="stylesheet" href="css/style.css">
  <!-- Startbild mit Namen: sichtbar, solange die App lädt (vorher war das Bild dabei leer). app.js blendet es aus,
       sobald die erste Seite steht; spätestens nach 8 s verschwindet es von selbst. -->
  <style>
    #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(60vmax 40vmax at 50% 40%, rgba(124, 58, 237, .22), transparent 70%), #0b0a1a;
      transition: opacity .45s ease; animation: bootAuto .45s 8s forwards; }
    #boot.is-out { opacity: 0; pointer-events: none; }
    #boot svg { width: 12vmin; height: 12vmin; overflow: visible; animation: bootIn .7s cubic-bezier(.2, .9, .25, 1) both; filter: drop-shadow(0 .6vmin 2.4vmin rgba(124, 58, 237, .45)); }
    #boot .bn { margin-top: 2.6vmin; font: 800 6vmin/1 "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: -.035em; color: #f4f4f6;
      animation: bootIn .7s .12s cubic-bezier(.2, .9, .25, 1) both; }
    #boot .bn span { font-weight: 300; color: #c9b8fb; }
    #boot .bl { margin-top: 3.4vmin; width: 14vmin; height: .35vmin; border-radius: 1vmin; background: rgba(255, 255, 255, .1); overflow: hidden; animation: bootIn .7s .25s both; }
    #boot .bl i { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8b5cf6, #c9b8fb); animation: bootBar 1.1s ease-in-out infinite; }
    @keyframes bootIn { from { opacity: 0; transform: translateY(1.2vmin) scale(.97); } }
    @keyframes bootBar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes bootAuto { to { opacity: 0; visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { #boot svg, #boot .bn, #boot .bl, #boot .bl i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <svg viewBox="0 0 100 100"><defs><linearGradient id="bootPlay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b06cff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="bootT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e4e2ec"/></linearGradient></defs><path d="M17 25H70a12 12 0 0 1 12 12M42 25v50" fill="none" stroke="url(#bootT)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path fill="url(#bootPlay)" transform="translate(16.5 11.5) scale(.78)" d="M50 38.5c0-3.3 3.6-5.3 6.4-3.6l25.4 15.6c2.7 1.7 2.7 5.6 0 7.2L56.4 73.4C53.6 75.1 50 73.1 50 69.8z"/></svg>
    <div class="bn">Telvo <span>Player</span></div>
    <div class="bl"><i></i></div>
  </div>
  <div id="app">
    <div id="screens"></div>
    <div id="dialog-layer"></div>
    <div id="toast-layer" aria-live="polite"></div>
  </div>

  <!-- Samsung (Tizen): Fernbedienungs-API – nur dort laden (überall sonst gab es bei jedem Start einen 404-Fehler) -->
  <script>if (/Tizen/i.test(navigator.userAgent)) document.write('<script src="$WEBAPIS/webapis/webapis.js" onerror="this.remove()"><\/script>');</script>
  <!-- Videobibliothek für HLS-Streams (wird beim Einrichten nach lib/ kopiert, sonst aus dem Internet geladen) -->
  <script src="lib/hls.min.js" onerror="this.remove()"></script>
  <!-- QR-Code für "Playlist per Handy hinzufügen" -->
  <script src="lib/qrcode.js" onerror="this.remove()"></script>
  <!-- Übersetzungen: Englisch und Türkisch immer, weitere Sprachen nur, wenn sie gewählt sind (js/i18n/xx.js) -->
  <script src="js/i18n.js"></script>
  <script>
    (function () {
      try {
        var l = (JSON.parse(localStorage.getItem('lumio.settings') || '{}') || {}).lang;
        if (l && /^[a-z]{2}$/.test(l) && l !== 'de' && l !== 'en' && l !== 'tr') document.write('<script src="js/i18n/' + l + '.js"><\/script>');
      } catch (e) {}
    })();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
