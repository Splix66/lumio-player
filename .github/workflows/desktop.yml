# Baut die PC-Version für Windows (.exe) und Mac (.dmg),
# sobald Dateien hochgeladen werden – oder per Klick unter "Actions → Run workflow".
name: PC-Version bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Mac auf Intel-Rechnern bauen: Die Apple-Silicon-Rechner (macos-latest) waren seit 1.14.3 oft 15 min lang
        # nicht frei, der Mac-Bau brach dann ab. Die .dmg ist „universal“ (Intel + Apple Silicon) – das geht auch hier.
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Projekt holen
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Bausteine installieren (hls.js, Schrift)
        run: npm install --ignore-scripts hls.js@1.7.3 mpegts.js@1.7.3 qrcode-generator@1.4.4 @fontsource/inter@5 && node scripts/copy-libs.js

      - name: Bilder erzeugen
        run: |
          python -m pip install pillow || python3 -m pip install --break-system-packages pillow
          python scripts/make-icons.py || python3 scripts/make-icons.py

      - name: App in die PC-Hülle kopieren
        run: |
          rm -rf desktop/app
          cp -R www desktop/app
          cp assets/icon-only.png desktop/icon.png

      - name: PC-App bauen
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npx electron-builder --publish never

      - name: Ergebnis sichern
        uses: actions/upload-artifact@v5
        with:
          name: pc-${{ matrix.os }}
          path: |
            desktop/dist/telvo-player-setup.exe
            desktop/dist/telvo-player-mac.dmg
          if-no-files-found: ignore

      # Jeder Rechner veröffentlicht seine Datei selbst, sobald sie fertig ist – Windows wartet nicht mehr auf den Mac
      # (GitHub hat oft lange keinen Mac-Rechner frei; vorher blieb dann auch Windows tagelang alt).
      # Die Versionsnummer steht an jeder Datei (Bezeichnung „Windows 1.2.3 (…)“); Webseite und App lesen sie dort.
      # Von main → Release „pc“. Per Klick auf einem Test-Zweig → Vorab-Release „pc-test“ (Kunden sehen es nicht).
      - name: Veröffentlichen (nur die Datei dieses Rechners)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'pc' || 'pc-test' }}
        run: |
          V=$(grep -oE "version: '[^']+'" www/js/app.js | head -n 1 | cut -d"'" -f2)
          V=${V:-neu}
          if [ "$RUNNER_OS" = "Windows" ]; then N=Windows; F=telvo-player-setup.exe; O=lumio-player-setup.exe
          else N=Mac; F=telvo-player-mac.dmg; O=lumio-player-mac.dmg; fi
          [ -f "desktop/dist/$F" ] || { echo "desktop/dist/$F fehlt"; exit 1; }
          # Ältere App-Versionen holen Updates unter dem früheren Namen – dieselbe Datei auch so ablegen
          cp "desktop/dist/$F" "desktop/dist/$O"
          NOTES="Windows und Mac werden einzeln veröffentlicht, sobald ihr Bau fertig ist. Welche Version gerade bereitliegt, steht an jeder Datei."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            EXTRA=""; [ "$TAG" = "pc" ] || EXTRA="--prerelease"
            # Beide Rechner können gleichzeitig hier ankommen – schlägt das Anlegen fehl, gibt es das Release schon
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Telvo Player $V – PC-Version" --notes "$NOTES" --latest=false $EXTRA || true
          fi
          gh release upload "$TAG" "desktop/dist/$F#$N $V ($F)" "desktop/dist/$O#$N $V ($O, früherer Name)" --clobber
          gh release edit "$TAG" --title "Telvo Player $V – PC-Version" --notes "$NOTES"
          echo "$N $V als $TAG veröffentlicht"
