<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="robots" content="noindex">
  <title>Seite nicht gefunden – Telvo Player</title>
  <!-- GitHub Pages zeigt diese Seite bei jeder unbekannten Adresse – deshalb feste Pfade statt relativer Links -->
  <link rel="icon" href="/lumio-player/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg: #0b0b0f; --surface: #14141a; --text: #f4f4f6; --muted: #a4a4b4; --accent-btn: #7442e6; --accent-2: #a78bfa; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(60% 50% at 80% 0%, rgba(139, 92, 246, .18), transparent 70%), var(--bg);
    }
    /* wie die App: Glas-Karte, Lavendel-Verlauf, Knöpfe als Glas-Pillen */
    main { max-width: 32rem; width: 100%; text-align: center; padding: 2.4rem 2rem 2.2rem; border-radius: 1.6rem;
      background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .018)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 2rem 4rem -2rem rgba(0, 0, 0, .8); }
    .code { font-size: clamp(4rem, 18vw, 7rem); font-weight: 800; letter-spacing: -.06em; line-height: 1; margin: 0;
      background: linear-gradient(180deg, #ffffff 25%, #c9b8fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 1.5rem; letter-spacing: -.02em; margin: 1rem 0 .5rem; }
    p { color: var(--muted); margin: 0 0 1.8rem; }
    .row { display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap; }
    a { display: inline-flex; align-items: center; padding: .8rem 1.3rem; border-radius: 999px; font-weight: 650; text-decoration: none; color: var(--text); background: rgba(255, 255, 255, .035); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
    a:hover { background: rgba(255, 255, 255, .07); }
    a.primary { background: linear-gradient(180deg, #7c4ff0, var(--accent-btn)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 .5rem 1.4rem -.6rem rgba(124, 79, 240, .7); color: #fff; }
    a:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Vielleicht hat sich die Adresse geändert oder es gab einen Tippfehler.</p>
    <div class="row">
      <a class="primary" href="/lumio-player/">Zur Startseite</a>
      <a href="/lumio-player/#download">App herunterladen</a>
    </div>
  </main>
</body>
</html>
