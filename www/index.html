<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a1a">
  <meta name="format-detection" content="telephone=no">
  <!-- Bilder und Streams ohne Herkunftsangabe laden – so wie richtige TV-Apps. Viele Logo-Server sperren sonst fremde Apps. -->
  <meta name="referrer" content="no-referrer">
  <title>Lumio Player</title>
  <link rel="icon" href="img/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="screens"></div>
    <div id="dialog-layer"></div>
    <div id="toast-layer" aria-live="polite"></div>
  </div>

  <!-- Samsung (Tizen): Fernbedienungs-API. Auf anderen Geräten wird das einfach ignoriert. -->
  <script src="$WEBAPIS/webapis/webapis.js" onerror="this.remove()"></script>
  <!-- Videobibliothek für HLS-Streams (wird beim Einrichten nach lib/ kopiert, sonst aus dem Internet geladen) -->
  <script src="lib/hls.min.js" onerror="this.remove()"></script>
  <!-- QR-Code für "Playlist per Handy hinzufügen" -->
  <script src="lib/qrcode.js" onerror="this.remove()"></script>
  <!-- Übersetzungen: Englisch und Türkisch immer, weitere Sprachen nur, wenn sie gewählt sind (js/i18n/xx.js) -->
  <script src="js/i18n.js"></script>
  <script>
    (function () {
      try {
        var l = (JSON.parse(localStorage.getItem('lumio.settings') || '{}') || {}).lang;
        if (l && /^[a-z]{2}$/.test(l) && l !== 'de' && l !== 'en' && l !== 'tr') document.write('<script src="js/i18n/' + l + '.js"><\/script>');
      } catch (e) {}
    })();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
