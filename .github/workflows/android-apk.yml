# Baut automatisch die Android-APK (Handy, Tablet, Fire TV, Android TV),
# sobald Dateien hochgeladen werden – oder per Klick unter "Actions → Run workflow".
name: Android-APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bausteine installieren
        run: npm install

      - name: Bilder erzeugen (Symbole, Banner)
        run: |
          pip install pillow
          python3 scripts/make-icons.py

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          node scripts/patch-android.js

      - name: App-Symbole erzeugen
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: App-Dateien übertragen
        run: |
          node scripts/patch-android.js
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen und mit festem Schlüssel signieren
        # Immer derselbe Schlüssel = Updates lassen sich über die alte Version installieren (ohne Deinstallieren).
        # Schlüssel und Passwort liegen NICHT im Projekt, sondern nur im Secret LUMIO_SIGNING
        # (Inhalt: PASSWORT:SCHLÜSSELDATEI-ALS-BASE64, eine Zeile).
        env:
          LUMIO_SIGNING: ${{ secrets.LUMIO_SIGNING }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk telvo-player.apk
          if [ -n "$LUMIO_SIGNING" ]; then
            S=$(printf '%s' "$LUMIO_SIGNING" | tr -d ' \r\n')
            export LUMIO_KS_PW="${S%%:*}"
            printf '%s' "${S#*:}" | base64 -d > "$RUNNER_TEMP/lumio.p12"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/lumio.p12" --ks-key-alias lumio \
              --ks-pass env:LUMIO_KS_PW --key-pass env:LUMIO_KS_PW telvo-player.apk
            rm -f "$RUNNER_TEMP/lumio.p12"
            "$BT/apksigner" verify --print-certs telvo-player.apk | head -n 3
            echo "🔑 Mit dem festen Telvo-Schlüssel signiert – Updates ohne Deinstallieren möglich." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Secret LUMIO_SIGNING fehlt – APK hat einen wechselnden Test-Schlüssel (Updates nur nach Deinstallieren)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Versionsnummer lesen
        id: ver
        run: |
          V=$(grep -oE "version: '[^']+'" www/js/app.js | head -n 1 | cut -d"'" -f2)
          echo "v=${V:-neu}" >> "$GITHUB_OUTPUT"

      # Nur von main aus veröffentlichen. Von einem Test-Zweig (z. B. per „Run workflow“) gestartet,
      # wird die APK nur als Download am Lauf abgelegt – die öffentliche Version für Kunden bleibt unberührt.
      - name: Test-APK als Download ablegen (nur Test-Zweige)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: telvo-player-test-apk
          path: telvo-player.apk

      # Ältere App-Versionen holen Updates unter dem früheren Namen – dieselbe Datei auch so ablegen
      - name: Kopie unter früherem Namen (lumio-player.apk)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: cp telvo-player.apk lumio-player.apk

      - name: APK unter "Releases" bereitstellen
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neueste
          name: Telvo Player ${{ steps.ver.outputs.v }} – neueste Version
          body: |
            Version ${{ steps.ver.outputs.v }}, automatisch gebaut aus ${{ github.sha }}.
            Download: telvo-player.apk (Handy, Tablet, Fire TV, Android TV)
            lumio-player.apk ist dieselbe Datei unter dem früheren Namen (für Updates aus älteren App-Versionen).
          files: |
            telvo-player.apk
            lumio-player.apk
          make_latest: true

      - name: Hinweis für Test-Zweige
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          echo "## 🧪 Test-APK fertig (nicht veröffentlicht)" >> $GITHUB_STEP_SUMMARY
          echo "Download unten unter „Artifacts“ → telvo-player-test-apk. Die Version für Kunden wurde nicht verändert." >> $GITHUB_STEP_SUMMARY

      - name: Download-Link anzeigen
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "## ✅ APK fertig" >> $GITHUB_STEP_SUMMARY
          echo "Direkter Download-Link (auch für die Downloader-App auf dem Fire TV):" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/latest/download/telvo-player.apk" >> $GITHUB_STEP_SUMMARY
